 <title id="diffusion-latency-title">Diffusion34 latency measurements</title><desc id="diffusion-latency-desc">Presentation-reported p99 U-Net inference latency: eager FP32 35.7 ms, compiled FP32 11.33 ms. A separate 40-second no-motion real-feedback shadow recorded p99 policy request latency 13.37 ms. The panels have different measurement scopes; dashed line is the 20 ms policy period.</desc><metadata>
