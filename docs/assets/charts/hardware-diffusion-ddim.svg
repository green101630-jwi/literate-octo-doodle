 <title id="hardware-diffusion-ddim-title">Archived Diffusion denoising-step simulation study</title><desc id="hardware-diffusion-ddim-desc">Archived 34D no-cube Diffusion policy in fixed demo6 simulation, evaluation seed 2026, eight parallel environments, temporal aggregation decay 0.01, 250 rollouts per setting. DDIM4: 62/250, 24.8%; DDIM5: 99/250, 39.6%; DDIM6: 125/250, 50.0%; DDIM7: 138/250, 55.2%; DDIM8: 168/250, 67.2%; DDIM9: 183/250, 73.2%; DDIM10: 197/250, 78.8%. Separate compiled10 run: 188/250, 75.2%. This is not the November 20D C128 model, not physical success, and not proof that compilation preserves task performance.</desc><metadata>
  <rdf:RDF>
   <ns2:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>Archived Diffusion denoising-step simulation study</dc:title>
    <dc:description>Archived 34D no-cube Diffusion policy in fixed demo6 simulation, evaluation seed 2026, eight parallel environments, temporal aggregation decay 0.01, 250 rollouts per setting. DDIM4: 62/250, 24.8%; DDIM5: 99/250, 39.6%; DDIM6: 125/250, 50.0%; DDIM7: 138/250, 55.2%; DDIM8: 168/250, 67.2%; DDIM9: 183/250, 73.2%; DDIM10: 197/250, 78.8%. Separate compiled10 run: 188/250, 75.2%. This is not the November 20D C128 model, not physical success, and not proof that compilation preserves task performance.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <ns2:Agent>
      <dc:title>Public hardware deployment chart generator</dc:title>
     </ns2:Agent>
    </dc:creator>
   </ns2:Work>
  </rdf:RDF>
 </metadata>
