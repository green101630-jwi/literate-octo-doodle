    <dc:title>Handover initial object-position coverage</dc:title>
    <dc:description>Scatter plot of 50 selected Mimic starts and 25 selected Teleop starts. All 25 Teleop positions coincide at zero; a single star represents them. Mimic population standard deviation is 9.90 mm in X and 9.36 mm in Y. Offsets are relative to the common Teleop start. No jitter is added. This describes dataset coverage, not policy generalization.</dc:description>
