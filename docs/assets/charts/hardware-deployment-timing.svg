<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns2="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" width="1320" height="1000" viewBox="0 0 950.4 720" version="1.1" role="img" aria-labelledby="hardware-deployment-timing-title hardware-deployment-timing-desc">
 <title id="hardware-deployment-timing-title">Diffusion model inference and live sensor message age</title><desc id="hardware-deployment-timing-desc">Separate timing studies. A: November Task2 C128 Diffusion, 20D observations, RTX 3070, DDIM10, 100 samples per mode. Standalone model p99 falls from 62.1834565 ms eager to 14.5776229 ms compiled; dashed line is the 20 ms reference period of a 50 Hz loop, not an end-to-end deadline guarantee. B: no-command live ROS feedback probe. Median sensor timestamp age changes from 191.982424 to 3.087694 ms for the left arm and 193.550917 to 4.648975 ms for the right arm when subscription queue depth changes from 20 to 1. Model compute and message age are distinct metrics; neither is a task-success result.</desc><metadata>
  <rdf:RDF>
   <ns2:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>Diffusion model inference and live sensor message age</dc:title>
    <dc:description>Separate timing studies. A: November Task2 C128 Diffusion, 20D observations, RTX 3070, DDIM10, 100 samples per mode. Standalone model p99 falls from 62.1834565 ms eager to 14.5776229 ms compiled; dashed line is the 20 ms reference period of a 50 Hz loop, not an end-to-end deadline guarantee. B: no-command live ROS feedback probe. Median sensor timestamp age changes from 191.982424 to 3.087694 ms for the left arm and 193.550917 to 4.648975 ms for the right arm when subscription queue depth changes from 20 to 1. Model compute and message age are distinct metrics; neither is a task-success result.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <ns2:Agent>
      <dc:title>Public hardware deployment chart generator</dc:title>
     </ns2:Agent>
    </dc:creator>
   </ns2:Work>
  </rdf:RDF>
 </metadata>
