 <title id="demonstration-failure-breakdown-title">Basket source-control rollout outcome breakdown</title><desc id="demonstration-failure-breakdown-desc">Both models are ACT, trained with seed 0 and evaluated with seed 2026. Each row contains 250 simulated Basket rollouts. Mimic50 A0: success 140, neither cube lifted 44, one not lifted 32, lifted but not placed 34. Mimic50 plus self50 B0: success 56, neither lifted 81, one not lifted 72, lifted but not placed 41. Not lifted means maximum recorded lift below 2.5 cm. Failure labels are descriptive heuristics and do not establish contact causes. This is one model per condition, not independent training replicates.</desc><title>Basket source-control rollout outcome breakdown</title>
